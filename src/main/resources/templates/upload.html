<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Upload - SecureDocSearch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar navbar-expand bg-light border-bottom mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/dashboard}">SecureDocSearch</a>
      <div class="d-flex align-items-center">
        <span class="me-3" sec:authentication="name">User</span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Upload Document</h2>

    <!-- success or error message from model -->
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <form method="post" enctype="multipart/form-data" th:action="@{/upload}" class="mb-3">
      <div class="mb-3">
        <input class="form-control" type="file" name="file" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Uploaded By</label>
        <input class="form-control" type="text" name="uploadedBy" th:value="${#authentication.name}" />
      </div>

      <div>
        <button class="btn btn-primary" type="submit">Upload</button>
        <a th:href="@{/dashboard}" class="btn btn-link">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
