<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - SecureDocSearch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar navbar-expand bg-light border-bottom mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/dashboard}">SecureDocSearch</a>
      <div class="d-flex align-items-center">
        <span class="me-3" sec:authentication="name">User</span>

        <!-- logout as a POST form -->
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <h3>Dashboard</h3>
    <div class="row mt-4">
      <div class="col-md-4">
        <div class="list-group">
          <a class="list-group-item list-group-item-action" th:href="@{/upload}">Upload Document</a>
          <a class="list-group-item list-group-item-action" th:href="@{/search}">Search Documents</a>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-3">
          <p class="mb-0">Welcome! Use the left menu to upload or search documents.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
