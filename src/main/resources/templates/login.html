<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - SecureDocSearch</title>
  <!-- Bootstrap 5 CDN (simple, no build config required) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background:#f6f8fa; }
    .card { max-width:420px; margin:6rem auto; box-shadow:0 6px 20px rgba(0,0,0,.05); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-body p-4">
      <h4 class="card-title mb-3 text-center">SecureDocSearch</h4>

      <!-- Error message when ?error is present -->
      <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Invalid username or password. Please try again.
      </div>

      <!-- Logout success message when ?logout -->
      <div th:if="${param.logout}" class="alert alert-success" role="alert">
        You have been logged out.
      </div>

      <form th:action="@{/login}" method="post" class="mb-2">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" placeholder="Username" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Password" required />
        </div>

        <div class="d-grid">
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
      </form>

      <div class="text-muted small mt-3">
        Default admin: <strong>admin</strong> / <strong>admin@123</strong>
      </div>
    </div>
  </div>
</body>
</html>
