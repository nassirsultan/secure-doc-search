<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Search - SecureDocSearch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar navbar-expand bg-light border-bottom mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/dashboard}">SecureDocSearch</a>
      <div class="d-flex align-items-center">
        <span class="me-3" sec:authentication="name">User</span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>Search Documents</h2>

    <form th:action="@{/doSearch}" method="get" class="row g-2 mb-3">
      <div class="col-auto" style="flex:1">
        <input class="form-control" type="text" name="keyword" placeholder="Enter keyword" th:value="${keyword}" required />
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
    </form>

    <!-- Results container (always shown after a search) -->
    <div th:if="${keyword != null}">
      <h5 th:text="'Results for &quot;' + ${keyword} + '&quot;'"></h5>

      <!-- Case: results list is empty -->
      <div th:if="${#lists.isEmpty(results)}" class="alert alert-warning">
        No results found for "<span th:text="${keyword}"></span>".
      </div>

      <!-- Case: there are results -->
      <div th:each="r : ${results}" class="card mb-2" th:if="${!#lists.isEmpty(results)}">
        <div class="card-body">
          <h6 class="card-title" th:text="${r.docName}">Doc Name</h6>
          <p class="card-text" th:text="${r.snippet}">Snippet</p>
          <p class="text-muted small" th:text="${'Uploaded by: ' + r.uploadedBy + ' on ' + r.uploadDate}"></p>

          <div class="d-flex">
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="me-2">
              <a th:href="@{/download/{id}(id=${r.docId})}" class="btn btn-outline-primary btn-sm">Download</a>
            </div>
          </div>
        </div>
      </div>

    </div>
      <!-- Back link outside the loop, always visible after a search -->
      <div class="mt-3">
        <a th:href="@{/dashboard}" class="btn btn-link">Back to Dashboard</a>
      </div>

  </div>
</body>
</html>
