server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/secure_docs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File storage
file.upload-dir=secure-files

# Import local overrides (gitignored)
spring.config.import=optional:application-local.properties

logging.level.org.springframework.security=DEBUG
